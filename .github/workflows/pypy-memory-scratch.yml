name: PyPy memory scratch (temporary, never in a PR)
on:
  push:
    branches: [claude/project-thread-upv4hd-pypy-memory-scratch]
jobs:
  probe:
    if: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install pypy3.11
      - run: uv run --python pypy3.11 --no-project python scratch/release_probe.py
  extras:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline]
    env:
      UV_PYTHON: pypy3.11
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install pypy3.11
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar xorriso
      - run: uv sync --python pypy3.11 --no-dev
      - name: install
        run: |
          for pkg in pyppmd inflate64 brotli lz4 cryptography pycdlib tqdm \
              backports.zstd rapidgzip \
              pytest pytest-timeout pytest-xdist hypothesis py7zr rarfile \
              libarchive-c urllib3 fsspec pyzstd; do
            uv pip install --python .venv "$pkg" > /dev/null 2>&1 || echo "FAILED $pkg"
          done
      - name: run
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
          PYTHONPATH: scratch
          MEMLOG_GCSTATS: "1"
        run: |
          nproc; free -m; cat /proc/sys/vm/overcommit_memory; ulimit -a
          (while sleep 20; do echo "MEM $(free -m | awk 'NR==2{print "used " $3 " of " $2 " avail " $7}') TOP $(ps -eo rss=,vsz=,args= --sort=-rss | head -5 | awk '{printf "%dMB/%dMB %s %s | ", $1/1024, $2/1024, $3, $NF}')"; done) > mem.log 2>&1 &
          MON=$!
          uv run --python pypy3.11 --no-sync pytest tests/ -q -n auto --timeout=300 -o addopts= --tb=short -p no:warnings -p memlog -m 'not ppmd_native_stress' --junitxml=extras.xml > pytest.out 2>&1 || true
          kill $MON
          tail -3 pytest.out
          cut -c1-330 mem.log
      - name: summary
        if: always()
        run: python3 scratch/summarize.py
      - name: first ENOMEM tracebacks
        if: always()
        run: |
          grep -n "Cannot allocate memory" pytest.out | head -5
          grep -B25 -m1 "Errno 12" pytest.out | cut -c1-220 | head -40
          echo "== crashes"; grep -n "crashed\|Fatal Python error\|Segmentation" pytest.out | cut -c1-250 | head -20
          grep -A30 -m3 "Fatal Python error" pytest.out | grep -v site-packages | cut -c1-200 | head -90
      - if: always()
        run: python3 scripts/junit_failure_lines.py extras.xml --width 200 | tail -40

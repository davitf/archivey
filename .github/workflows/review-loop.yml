name: Review loop

# Adding the `review` label to a pull request runs one review round, and the round takes
# the label off as it starts. That is the whole trigger.
#
# A round is a Claude session that did not write the diff reading it from zero with the
# repo's own `code-review-skill`, posting its findings, and writing a verdict. The
# verdict decides what the closing comment asks for: when the reviewer wants to see the
# fixes, the implementer pushes them and adds the label again; otherwise nobody does.
#
# Who adds the label is the implementing agent when its pull request is ready and again
# after each round of fixes (`address-review-findings`), or a person at any time. Only
# someone with triage access can label a pull request, so the label is also the
# permission check. Past `MAX_ROUNDS` in the gate, only a person's label runs a round:
# agents label as bot accounts, and GitHub reports who added it.
#
# Rounds are counted from the closing comments this workflow posted, so there is no
# round state to fall out of step, and nothing ever runs without a fresh label.
#
# `scripts/review_loop_gate.py` makes the decisions and writes the closing comment, and
# is unit tested. `dev-docs/review-loop.md` is the prose version.

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# Never cancel a review in flight: a half-posted review leaves inline threads with no
# body to read them against. A request made during a round queues behind it. The label
# is in the group because GitHub keeps one pending run per group and cancels the older:
# without it, adding any other label during a round would cancel a queued review.
concurrency:
  group: review-loop-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

jobs:
  loop:
    name: Review round
    # Screened here so that every other label, and a fork, costs no runner. A fork's
    # `pull_request` run has no secrets and a read-only token, so it could neither
    # review nor take the label off.
    if: >-
      github.event.label.name == 'review' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to run
        id: gate
        env:
          SENDER_TYPE: ${{ github.event.sender.type }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          # Read now, not from the event: the label may have come off since the event
          # fired, and a push may have moved the head.
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" \
            --json labels,headRefOid > /tmp/pr.json

          # One line per round comment, then counted. `--jq` runs once per page, so a
          # per-page `length` would print one number per page instead of a total.
          rounds="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]")
                      | select(.body | startswith("<!-- archivey-review-round "))
                      | .id' | wc -l)"

          jq -n \
            --slurpfile pr /tmp/pr.json \
            --argjson rounds "$rounds" \
            --arg sender_type "$SENDER_TYPE" \
            --arg sender_login "$SENDER_LOGIN" \
            --arg repository "$GITHUB_REPOSITORY" \
            '{labels: [$pr[0].labels[].name], rounds_done: $rounds,
              sender_type: $sender_type, sender_login: $sender_login,
              repository: $repository}' > /tmp/gate-input.json

          python3 scripts/review_loop_gate.py < /tmp/gate-input.json > /tmp/gate.json
          cat /tmp/gate.json
          {
            echo "run=$(jq -r .run /tmp/gate.json)"
            echo "round=$(jq -r .round /tmp/gate.json)"
            echo "final=$(jq -r .final /tmp/gate.json)"
            echo "cap_reached=$(jq -r .cap_reached /tmp/gate.json)"
            echo "max_rounds=$(jq -r .max_rounds /tmp/gate.json)"
            echo "head_sha=$(jq -r .headRefOid /tmp/pr.json)"
          } >> "$GITHUB_OUTPUT"
          jq -r '"Gate: run=\(.run) round=\(.round) — \(.reason)"' /tmp/gate.json \
            >> "$GITHUB_STEP_SUMMARY"

      # As soon as the gate has answered, and whatever it answered, so the label is free
      # to be added again: adding a label that is already there raises no event, so one
      # left on would make the next request silently do nothing. Taking it off at the
      # start rather than the end means a request made while this round runs is a new
      # round queued behind it, not one this round then deletes.
      - name: Take the label off
        if: always()
        run: |
          gh api --method DELETE \
            "repos/$GITHUB_REPOSITORY/issues/$PR/labels/review" --silent || true

      - name: Say the cap is spent
        if: steps.gate.outputs.cap_reached == 'true'
        run: |
          set -euo pipefail
          jq -r .comment /tmp/gate.json > /tmp/comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Claude review
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action refuses a bot-initiated run unless the bot is named here, and an
          # agent adds the label as a bot. Named rather than `*`, so an unexpected bot
          # cannot spend review credits. The action reports the actor with and without
          # the `[bot]` suffix depending on the code path, so both spellings are listed.
          allowed_bots: "claude,claude[bot],cursor,cursor[bot]"
          claude_args: |
            --model claude-opus-5
            --allowedTools Read,Grep,Glob,WebFetch,Bash
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            This is review round ${{ steps.gate.outputs.round }}. Another round runs only
            if your verdict asks to see the fixes, and an agent can ask for at most
            ${{ steps.gate.outputs.max_rounds }} rounds — which is the addendum's own
            round budget, so review as it tells you to and let the verdict say whether
            another round is needed rather than padding one to reach it.

            Follow this repository's own review skill, in full, as if it had been invoked
            by name: read `.claude/skills/code-review-skill/SKILL.md` and
            `.claude/skills/code-review-skill/reference/archivey-review-addendum.md`
            first, and obey them over any generic review habit. In particular:

            - The three-block output shape (§0), stable finding IDs kept across rounds,
              and §10 for posting: inline review comments for located findings, blocks 1
              and 3 in the review body, `event: COMMENT`.
            - Open every comment you post with a heading, per §10: the round and the
              verdict on the review body, the ID with its severity and confidence on an
              inline finding. Post no table in anything — bullets instead.
            - On any round after the first, open with one status bullet per previous ID
              before any new finding.
            - Do not re-run the gates. Do not edit any code. You are reviewing.
            - Do not write a prompt or brief for whoever fixes this. They read the PR.

            Use `gh` for GitHub writes. End every comment you post with a `---` rule and
            `_Generated by [Claude Code](https://claude.ai/code)_`.

            Then write `/tmp/loop-verdict.json`, and nothing else to that path:

            {
              "verdict": "clean" | "approved" | "findings" | "decision",
              "summary": "at most 400 characters, plain language, no finding IDs and no
                          file paths: what someone who has not opened the diff needs to
                          know about where this PR stands",
              "question": "if verdict is decision: the one question for the maintainer,
                           in plain language, answerable in a word or a short line.
                           Otherwise an empty string"
            }

            `verdict` is "decision" if block 3 has anything in it at all — a maintainer
            decision stops the review, and that beats the findings. It is "clean" only
            if block 2 is empty.

            Otherwise it carries your §0 verdict line, and this is the field that decides
            whether another round is asked for, so match it to what you actually wrote:

            - "approved" for ✅ Approve, for ✅ Approve conditional on the listed fixes,
              and for 💬 Comment — all three mean you do not need to see the result, and
              the last two mean the findings are the implementer's to fix. No further
              round is asked for; the findings are still posted in full and the
              implementer still works through them. ("clean" is narrower: block 2
              empty, so a plain ✅ Approve over 💡/📚/🎉 annotations is "approved", not
              "clean".)
            - "findings" for 🔄 Request Changes — a 🔴 stands, or a fix wants a look once
              it lands. That is what asks for the next round.

            Do not write "findings" to keep a round in hand: rounds are not yours to
            bank, and one spent re-reading wording you already described is the case the
            budget exists to stop. Equally, do not write "approved" with a 🔴 open.

      # `always()` so that a review that died still says so, rather than leaving a pull
      # request whose label came off with nothing on it saying why.
      - name: Close the round
        if: always() && steps.gate.outputs.run == 'true'
        env:
          ROUND: ${{ steps.gate.outputs.round }}
          FINAL: ${{ steps.gate.outputs.final }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha }}
        run: |
          set -euo pipefail
          # A missing file is a review that did not finish, which does not count. A file
          # that is there but is not a JSON object still counts — the findings were
          # posted — and the gate treats its verdict as `findings`.
          if [ ! -f /tmp/loop-verdict.json ]; then
            verdict=null
          elif jq -e 'type == "object"' /tmp/loop-verdict.json >/dev/null 2>&1; then
            verdict="$(cat /tmp/loop-verdict.json)"
          else
            verdict='"unreadable"'
          fi

          jq -n \
            --argjson round "$ROUND" \
            --argjson final "$FINAL" \
            --arg head_sha "$HEAD_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson verdict "$verdict" \
            '{round: $round, final: $final, head_sha: $head_sha,
              repository: $repository, verdict: $verdict}' \
            | python3 scripts/review_loop_gate.py --finish > /tmp/finish.json
          jq -r '"Verdict: \(.verdict) stop=\(.stop) counted=\(.counted) — \(.reason)"' \
            /tmp/finish.json >> "$GITHUB_STEP_SUMMARY"

          jq -r .comment /tmp/finish.json > /tmp/comment.md
          if [ -s /tmp/comment.md ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
          fi

name: PyPy scratch (temporary, removed before review)
on:
  push:
    branches: [claude/project-thread-upv4hd]
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: pypy3.11
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install pypy3.11
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar xorriso
      - run: uv sync --python pypy3.11 --no-dev
      - name: core-only, no xdist, short tracebacks
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run --python pypy3.11 --no-sync
          --with pytest --with pytest-timeout
          pytest tests/ -q --timeout=300 -o addopts= --tb=short -p no:warnings
          -m 'not ppmd_native_stress' --junitxml=core.xml > pytest.out 2>&1 || true; tail -5 pytest.out
      - if: always()
        run: python3 scripts/junit_failure_lines.py core.xml --detail 14 --width 260

  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        drop: [none, lz4]
    env:
      UV_PYTHON: pypy3.11
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install pypy3.11
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar xorriso
      - run: uv sync --python pypy3.11 --no-dev
      - name: install
        run: |
          for pkg in pyppmd inflate64 brotli lz4 cryptography pycdlib tqdm \
              backports.zstd rapidgzip \
              pytest pytest-timeout pytest-xdist hypothesis py7zr rarfile \
              libarchive-c urllib3 fsspec pyzstd; do
            [ "$pkg" = "${{ matrix.drop }}" ] && continue
            uv pip install --python .venv "$pkg" > /dev/null 2>&1 || echo "FAILED $pkg"
          done
      - name: rapidgzip in-process smoke
        if: matrix.drop == 'none'
        continue-on-error: true
        run: |
          .venv/bin/python .github/pypy_smoke.py
          for m in partial full memoryview block bad; do .venv/bin/python -X faulthandler .github/pypy_lz4_stress.py $m 2>&1 | tail -5; echo "rc=${PIPESTATUS[0]}"; done
      - name: extras
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          uv run --python pypy3.11 --no-sync
          pytest tests/ -q -n auto --timeout=300 -o addopts= --tb=short -p no:warnings
          -m 'not ppmd_native_stress' --junitxml=extras.xml > pytest.out 2>&1 || true;
          tail -3 pytest.out; echo "segfaults: $(grep -c 'Segmentation fault' pytest.out)";
          grep -A8 'Fatal Python error' pytest.out | grep 'File' | grep -v site-packages | head -40
      - if: always() && matrix.drop == 'none'
        run: python3 scripts/junit_failure_lines.py extras.xml --detail 14 --width 260
      - if: always() && matrix.drop != 'none'
        run: python3 scripts/junit_failure_lines.py extras.xml --width 260

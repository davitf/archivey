name: PyPy scratch (temporary, removed before review)
on:
  push:
    branches: [claude/project-thread-upv4hd]
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: pypy3.11
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install pypy3.11
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar xorriso
      - run: uv sync --python pypy3.11 --no-dev
      - name: core-only, short tracebacks
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          (while sleep 15; do echo "MEM $(free -m | awk 'NR==2{print "used " $3 " of " $2 " avail " $7}') swap $(free -m | awk 'NR==3{print $3}') TOP $(ps -eo rss=,args= --sort=-rss | head -4 | awk '{printf "%dMB %s %s %s | ", $1/1024, $2, $3, $NF}')"; done) > mem.log 2>&1 & MON=$!; cat /proc/sys/vm/overcommit_memory;
          uv run --python pypy3.11 --no-sync
          --with pytest --with pytest-timeout --with pytest-xdist
          pytest tests/ -q -n auto --timeout=300 -o addopts= --tb=short -p no:warnings
          -m 'not ppmd_native_stress' --junitxml=core.xml > pytest.out 2>&1 || true; tail -5 pytest.out; kill $MON; cat mem.log | cut -c1-400
      - if: always()
        run: python3 scripts/junit_failure_lines.py core.xml --detail 14 --width 260

  extras:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        drop: [none]
    env:
      UV_PYTHON: pypy3.11
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install pypy3.11
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full unrar xorriso
      - run: uv sync --python pypy3.11 --no-dev
      - name: install
        run: |
          for pkg in pyppmd inflate64 brotli lz4 cryptography pycdlib tqdm \
              backports.zstd rapidgzip \
              pytest pytest-timeout pytest-xdist hypothesis py7zr rarfile \
              libarchive-c urllib3 fsspec pyzstd; do
            [ "$pkg" = "${{ matrix.drop }}" ] && continue
            uv pip install --python .venv "$pkg" > /dev/null 2>&1 || echo "FAILED $pkg"
          done
      - name: extras
        continue-on-error: true
        env:
          PYTHONFAULTHANDLER: "1"
        run: >
          (while sleep 15; do echo "MEM $(free -m | awk 'NR==2{print "used " $3 " of " $2 " avail " $7}') swap $(free -m | awk 'NR==3{print $3}') TOP $(ps -eo rss=,args= --sort=-rss | head -4 | awk '{printf "%dMB %s %s %s | ", $1/1024, $2, $3, $NF}')"; done) > mem.log 2>&1 & MON=$!; cat /proc/sys/vm/overcommit_memory;
          uv run --python pypy3.11 --no-sync
          pytest tests/ -q -n auto --timeout=300 -o addopts= --tb=short -p no:warnings
          -m 'not ppmd_native_stress' --junitxml=extras.xml > pytest.out 2>&1 || true; kill $MON; cat mem.log | cut -c1-400;
          tail -3 pytest.out; echo "segfaults: $(grep -c 'Segmentation fault' pytest.out)";
          grep -A8 'Fatal Python error' pytest.out | grep 'File' | grep -v site-packages | head -40
      - if: always() && matrix.drop == 'none'
        run: python3 scripts/junit_failure_lines.py extras.xml --detail 5 --width 220
      - if: always() && matrix.drop != 'none'
        run: python3 scripts/junit_failure_lines.py extras.xml --width 260

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # This file is generated by the Claude GitHub App installer. Re-running the
    # installer will overwrite this file, and these guards with it.
    #
    # Two conditions repeat on every branch, for reasons this repo learned the hard way.
    #
    # `user.type != 'Bot'`: this assistant answers a person asking. It passes no
    # `allowed_bots`, so a bot-authored mention the action *does* read as addressed to it
    # aborts with "Workflow initiated by non-human actor" and posts a **red check on the
    # pull request**. That happened on #369 when `cursor[bot]` left a review comment
    # mentioning `@claude` while discussing the review loop. A mention the action does not
    # read as a request ("No trigger was met for @claude") skips harmlessly instead, so the
    # abort is intermittent by the action's own judgement — which is the reason to guard
    # rather than to rely on it. Adding `allowed_bots` would be the wrong repair: it would
    # make those runs actually execute, which is more agent usage rather than less. Bots
    # talk to each other through the loop's own trigger, not by summoning this.
    #
    # `!contains(…, '@claude review')` hands that one phrase to `review-loop.yml`, which
    # also listens to `issue_comment`. It used to be on the `issue_comment` branch alone,
    # so a review thread *about* the loop still woke this workflow. Every branch that
    # reads a body needs it.
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.user.type != 'Bot' && contains(github.event.comment.body, '@claude') && !contains(github.event.comment.body, '@claude review')) ||
      (github.event_name == 'pull_request_review' && github.event.review.user.type != 'Bot' && contains(github.event.review.body, '@claude') && !contains(github.event.review.body, '@claude review')) ||
      (github.event_name == 'issues' && github.event.issue.user.type != 'Bot' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'

